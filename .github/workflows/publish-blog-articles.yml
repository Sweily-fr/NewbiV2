name: Publish Blog Articles

# Publication quotidienne du blog (plan éditorial v2 : 2 articles par jour
# ouvré). Le script prend les prochains articles non publiés de
# content/blog/_publication-queue.json, passe published: true, puis le
# commit sur main déclenche le déploiement Vercel.
#
# Images : sans secret OPENAI_API_KEY, on publie avec --skip-images (les
# articles du plan v2 ne contiennent pas de balise <Image>). Avec la clé, le
# script génère les illustrations et refuse de publier si la génération échoue.

on:
  schedule:
    - cron: "0 6 * * 1-5" # lundi → vendredi, 06:00 UTC = 08:00 Paris (été) / 07:00 (hiver)
  workflow_dispatch:
    inputs:
      count:
        description: "Nombre d'articles à publier (vide = tous les articles dont la date planifiée est atteinte)"
        required: false
        default: ""
      images_only:
        description: "Générer uniquement les images des articles déjà publiés (aucune publication)"
        required: false
        type: boolean
        default: false
      force_images:
        description: "Régénérer les images même si elles existent déjà"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-blog-articles
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Le hook husky pre-push (vitest complet) ne doit pas bloquer une
      # publication éditoriale : du 09 au 18/09/2026, 3 tests unitaires rouges
      # sur main ont fait échouer 8 runs de suite sans publier un seul article.
      # Les tests ont leur propre workflow (ci.yml).
      HUSKY: "0"
    steps:
      - name: Checkout repository (main)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      # Python n'est utile qu'avec une clé OpenAI, mais l'installation coûte
      # quelques secondes : on la garde inconditionnelle pour rester simple.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install openai Pillow

      - name: Install Node dependencies
        run: npm ci

      - name: Publish articles (and generate images when a key is available)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.NEWBI_ACCESS_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          FLAGS=""
          if [ "${{ github.event.inputs.force_images }}" = "true" ]; then
            FLAGS="$FLAGS --force-images"
          fi
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY absent : publication sans images (--skip-images)."
            FLAGS="$FLAGS --skip-images"
          fi
          if [ "${{ github.event.inputs.images_only }}" = "true" ]; then
            node scripts/publish-articles.js --images-only $FLAGS
          else
            # Sans nombre, le script publie tout ce qui est dû (date planifiée
            # atteinte) : 2 par jour ouvré en régime normal, le retard complet
            # après un incident.
            node scripts/publish-articles.js ${{ github.event.inputs.count }} $FLAGS
          fi

      - name: Commit and push to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/ public/blog/
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "blog: publish articles $(date +%Y-%m-%d)"
          git push --no-verify origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # develop ne doit jamais être en retard sur main : on y reporte le commit
      # de publication. En cas de conflit (rare : develop a touché les mêmes
      # fichiers), on laisse develop tel quel et on le signale.
      - name: Back-merge main into develop
        if: steps.commit.outputs.pushed == 'true'
        run: |
          git fetch origin develop
          git checkout -B develop origin/develop
          if git merge --no-edit origin/main; then
            git push --no-verify origin develop
          else
            echo "::warning::Back-merge main → develop en conflit : à faire à la main (git checkout develop && git merge main)."
            git merge --abort || true
          fi

      # Alerte en cas d'échec : une issue GitHub (notifiée par e-mail aux
      # personnes qui suivent le dépôt, rouverte/commentée tant que ça dure)
      # et Discord si DISCORD_WEBHOOK_URL est renseigné.
      - name: Alerte si la publication a échoué
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Publication blog en échec"
          BODY="Le workflow de publication des articles a échoué le $(date -u +%Y-%m-%d) : $RUN_URL

          Tant que ce n'est pas corrigé, aucun article du plan éditorial n'est publié. Une fois corrigé, le run suivant rattrape tout le retard (mode « dû »)."
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label bug --body "$BODY" \
              || gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
          if [ -n "$DISCORD_WEBHOOK" ]; then
            PAYLOAD=$(jq -n --arg run "$RUN_URL" '{content: "<@here>", embeds: [{title: "🚨 Publication blog en échec — newbiv2", description: "Aucun article publié aujourd\u0027hui. Voir le run.", color: 15548997, fields: [{name: "Run", value: $run}], timestamp: (now | todate)}]}')
            curl -sS -X POST -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK" || true
          fi
