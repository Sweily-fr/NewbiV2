# Tests de bout en bout de Newbi (site + API), lancés depuis la page
# « Tests » de l'admin (admin.newbi.fr/tests/newbi), à la main depuis
# l'onglet Actions, et sur chaque PR vers main (release ou hotfix) : dernier
# filet avant la prod, avec l'API de main (celle de la prod, toujours livrée
# avant le site).
#
# Demande du 27/11/2026 (« tester uniquement les fonctionnalités qu'on est en
# train de faire, et tout d'un coup le matin et le soir ») :
#   - sur une PR vers main, seulement les dossiers des fonctionnalités touchées
#     (tests-e2e/choisir-tests.mjs) + le socle de connexion ; toute la suite si
#     un fichier du socle change (dépendances, next.config, middleware…) ;
#   - toute la suite deux fois par jour sur develop (site et API), 7 h et 19 h
#     à Paris en hiver (8 h et 20 h en été : la planification est en UTC).
# main exige les 16 vérifications « Tests E2E (machine N) » : les machines sans
# tests à faire répondent tout de suite (job « e2e-libres »). Données de test uniquement (base Mongo en mémoire, services
# externes coupés, voir tests-e2e/serveur.mjs) : aucun secret de prod (seul
# NEWBI_API_TOKEN, en lecture seule sur newbi-api, si ce dépôt est privé).
#
# Les tests sont répartis sur plusieurs machines en parallèle (chacune avec sa
# base, son API et son site), puis un dernier job rassemble leurs résultats
# en un seul rapport (résultats, captures, vidéo de chaque test), publié en
# artefact « rapport-admin », que la page « Tests » lit ensuite.
name: Tests E2E
run-name: "Tests E2E${{ github.event_name == 'pull_request' && format(' (PR #{0})', github.event.pull_request.number) || github.event_name == 'schedule' && ' (suite complète du matin ou du soir, develop)' || inputs.declenche_par && format(' ({0})', inputs.declenche_par) || '' }}"

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      declenche_par:
        description: "Qui lance les tests (e-mail de l'admin)"
        required: false
        default: ""
      branche_api:
        description: "Branche de newbi-api à tester avec le site"
        required: false
        default: "develop"
      fichiers:
        description: "Seulement ces dossiers ou fichiers de tests (ex. « clients factures/liste »), vide = tout"
        required: false
        default: ""
      filtre:
        description: "Seulement les tests dont le nom contient ce texte (--grep), vide = tous"
        required: false
        default: ""
      machines:
        description: "Nombre de machines en parallèle"
        required: false
        type: choice
        options: ["16", "1", "2", "4", "6", "8", "10", "12", "20"]
        default: "16"
      inventaire:
        description: "Relevé de toutes les pages (outil pour écrire les tests, ne vérifie rien)"
        required: false
        type: boolean
        default: false

# Lancements à la main : un à la fois par branche (l'admin lance sur develop).
# Sur une PR : un nouveau push remplace le lancement en cours de cette PR.
concurrency:
  group: tests-e2e-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Quels tests, sur combien de machines, avec quelles branches
  plan:
    name: Choix des tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      fichiers: ${{ steps.choix.outputs.fichiers }}
      actives: ${{ steps.choix.outputs.actives }}
      libres: ${{ steps.choix.outputs.libres }}
      site: ${{ steps.choix.outputs.site }}
      api: ${{ steps.choix.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Choisir
        id: choix
        run: |
          set -euo pipefail
          SITE=""
          API="${BRANCHE_API:-}"
          if [ "$EVENEMENT" = "pull_request" ]; then
            git diff --name-only "origin/$BASE...HEAD" > modifies.txt
            echo "Fichiers modifiés : $(wc -l < modifies.txt)"
            CHOIX=$(node tests-e2e/choisir-tests.mjs < modifies.txt)
            FICHIERS=$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).fichiers)' "$CHOIX")
            N=$(node -e 'process.stdout.write(String(JSON.parse(process.argv[1]).machines))' "$CHOIX")
            API="${API:-$([ "$BASE" = main ] && echo main || echo develop)}"
          elif [ "$EVENEMENT" = "schedule" ]; then
            FICHIERS=""
            N=16
            SITE="develop"
            API="develop"
          else
            FICHIERS="${FICHIERS_DEMANDES:-}"
            N="${MACHINES:-16}"
            API="${API:-develop}"
          fi
          ACTIVES=$(node -e 'const n=+process.argv[1];process.stdout.write(JSON.stringify(Array.from({length:n},(_,i)=>i+1)))' "$N")
          # Machines exigées par la protection de main (1 à 16) sans tests à faire
          LIBRES=$(node -e 'const n=+process.argv[1];process.stdout.write(JSON.stringify(Array.from({length:Math.max(0,16-n)},(_,i)=>n+i+1)))' "$N")
          echo "Tests : ${FICHIERS:-toute la suite} ; machines : $N ; site : ${SITE:-cette PR} ; API : $API"
          {
            echo "fichiers=$FICHIERS"
            echo "actives=$ACTIVES"
            echo "libres=$LIBRES"
            echo "site=$SITE"
            echo "api=$API"
          } >> "$GITHUB_OUTPUT"
        env:
          EVENEMENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BRANCHE_API: ${{ inputs.branche_api }}
          FICHIERS_DEMANDES: ${{ inputs.fichiers }}
          MACHINES: ${{ inputs.machines }}

  # Machines exigées par la protection de main mais sans tests à faire
  e2e-libres:
    name: Tests E2E (machine ${{ matrix.machine }})
    needs: plan
    if: ${{ needs.plan.outputs.libres != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      matrix:
        machine: ${{ fromJSON(needs.plan.outputs.libres) }}
    steps:
      - run: echo "Aucun test sur cette machine (tests ciblés sur les fonctionnalités touchées)."

  e2e:
    name: Tests E2E (machine ${{ matrix.machine }})
    needs: plan
    # ubuntu-latest est passé en 26.04, que Playwright ne gère pas encore
    # (« Playwright does not support chromium on ubuntu26.04-x64 »)
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.inventaire && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        machine: ${{ fromJSON(needs.plan.outputs.actives) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.site }}

      # NEWBI_API_TOKEN (jeton en lecture seule sur newbi-api) est nécessaire
      # quand newbi-api est privé ; tant qu'il est public, l'accès par défaut suffit.
      - name: Récupérer newbi-api
        uses: actions/checkout@v4
        with:
          repository: Sweily-fr/newbi-api
          ref: ${{ needs.plan.outputs.api }}
          path: newbi-api
          token: ${{ secrets.NEWBI_API_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            newbi-api/package-lock.json

      - name: Installer les dépendances du site
        run: npm ci

      - name: Installer les dépendances de l'API
        run: npm ci
        working-directory: newbi-api

      # Restauration et sauvegarde séparées : actions/cache ne sauve rien quand
      # un test échoue, et les lancements suivants retéléchargeaient tout.
      - name: Restaurer MongoDB et Chromium
        id: cache-outils
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
          key: e2e-outils-${{ runner.os }}-${{ hashFiles('package-lock.json', 'newbi-api/package-lock.json') }}

      # Cache de compilation Next : clé par commit, repris du plus récent.
      - name: Restaurer le cache de compilation du site
        id: cache-build
        uses: actions/cache/restore@v4
        with:
          path: .next-e2e-newbi/cache
          key: e2e-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: e2e-build-${{ runner.os }}-

      # Le dépôt apt de Microsoft (préinstallé sur le runner, inutile à
      # Chromium) répond parfois 403 : apt-get update échouait et la machine
      # tombait avant le premier test (PR #1705, machine 11). Il est retiré, et
      # l'installation retentée une fois en cas de coupure réseau.
      - name: Installer Chromium
        run: |
          sudo grep -l "packages.microsoft.com" /etc/apt/sources.list.d/* 2>/dev/null | xargs -r sudo rm -f
          npx playwright install --with-deps chromium || { sleep 15; npx playwright install --with-deps chromium; }

      # Chaque machine prend sa part des tests (--shard) et garde ses
      # résultats bruts (blob), rassemblés par le job « Rapport ».
      - name: Lancer les tests
        run: |
          if ! [[ "$FICHIERS" =~ ^[A-Za-z0-9_./\ -]*$ ]]; then
            echo "::error::Liste de fichiers invalide : $FICHIERS"
            exit 1
          fi
          FILTRER=()
          if [ -n "$FILTRE" ]; then FILTRER=(--grep "$FILTRE"); fi
          # shellcheck disable=SC2086 # plusieurs dossiers séparés par des espaces
          npx playwright test -c tests-e2e $FICHIERS "${FILTRER[@]}" \
            --shard="${{ matrix.machine }}/${{ strategy.job-total }}" \
            --reporter=blob,list --pass-with-no-tests
        env:
          FICHIERS: ${{ needs.plan.outputs.fichiers }}
          FILTRE: ${{ inputs.filtre }}
          NEWBI_API_DIR: newbi-api
          E2E_CAPTURES: "1"
          E2E_RAPPORT_ADMIN: "1"
          E2E_INVENTAIRE: ${{ inputs.inventaire && '1' || '' }}
          PLAYWRIGHT_BLOB_OUTPUT_FILE: blob-report/machine-${{ matrix.machine }}.zip

      - name: Garder MongoDB et Chromium pour les prochains lancements
        if: ${{ !cancelled() && steps.cache-outils.outputs.cache-hit != 'true' && matrix.machine == 1 }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/mongodb-binaries
            ~/.cache/ms-playwright
          key: ${{ steps.cache-outils.outputs.cache-primary-key }}

      - name: Garder le cache de compilation du site
        if: ${{ !cancelled() && steps.cache-build.outputs.cache-hit != 'true' && matrix.machine == 1 && hashFiles('.next-e2e-newbi/cache/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .next-e2e-newbi/cache
          key: ${{ steps.cache-build.outputs.cache-primary-key }}

      - name: Garder les résultats de cette machine
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: resultats-machine-${{ matrix.machine }}
          path: blob-report/
          retention-days: 1
          if-no-files-found: ignore

      - name: Publier le relevé des pages
        if: ${{ !cancelled() && inputs.inventaire }}
        uses: actions/upload-artifact@v4
        with:
          name: inventaire-machine-${{ matrix.machine }}
          path: tests-e2e/inventaire-resultats/
          retention-days: 14
          if-no-files-found: ignore

  rapport:
    name: Rapport
    needs: [plan, e2e]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.site }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances du site
        run: npm ci

      - name: Récupérer les résultats des machines
        uses: actions/download-artifact@v4
        with:
          pattern: resultats-machine-*
          path: blob-report
          merge-multiple: true

      # Un seul rapport, comme si tout avait tourné sur une machine.
      - name: Rassembler les résultats
        run: npx playwright merge-reports -c tests-e2e/rapport.config.mjs blob-report
        env:
          E2E_RAPPORT_ADMIN: "1"
          E2E_DECLENCHE_PAR: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.event_name == 'schedule' && 'Suite complète (matin ou soir)' || inputs.declenche_par }}"

      - name: Publier le rapport pour l'admin
        uses: actions/upload-artifact@v4
        with:
          name: rapport-admin
          path: rapport-admin/
          retention-days: 30
          if-no-files-found: warn

      - name: Publier le rapport Playwright complet
        uses: actions/upload-artifact@v4
        with:
          name: rapport-playwright
          path: tests-e2e/rapport-html/
          retention-days: 14
          if-no-files-found: ignore

      # Les tests rouges font échouer le lancement (comme avant la répartition).
      - name: Résultat
        if: ${{ needs.e2e.result != 'success' }}
        run: |
          echo "::error::Des tests ont échoué : voir le rapport."
          exit 1
