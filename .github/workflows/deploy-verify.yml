name: Vérification de la prod

# Après chaque mise en production du site (déploiement Vercel « Production »
# réussi, signalé à GitHub par Vercel), vérifie que les pages publiques
# principales répondent : sur le nouveau déploiement lui-même, puis sur
# www.newbi.fr. En cas d'échec : une issue GitHub (e-mail aux personnes qui
# suivent le dépôt), commentée tant que ça dure, comme pour le blog.
#
# Remplace l'ancienne vérification, qui attendait une CI verte sur main (la
# CI ne tourne plus que sur les PR) et des tests « smoke » jamais écrits.
# Retour en arrière : Vercel → Deployments → « Instant Rollback ».

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verification:
    name: Pages publiques
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Vérifier les pages
        env:
          DEPLOIEMENT: ${{ github.event.deployment_status.environment_url }}
        run: |
          # Une page est bonne si elle répond 200 et contient « Newbi ».
          # Plusieurs essais : le domaine bascule sur le nouveau déploiement
          # quelques secondes après le statut « réussi ».
          verifier() {
            for essai in 1 2 3 4 5 6; do
              code=$(curl -sL -o page.html -w "%{http_code}" --max-time 30 "$1" || echo 000)
              if [ "$code" = "200" ] && grep -q "Newbi" page.html; then
                echo "OK  $1"
                return 0
              fi
              sleep 10
            done
            echo "::error::$1 répond $code"
            return 1
          }

          echec=0
          for site in $DEPLOIEMENT https://www.newbi.fr; do
            for page in / /auth/login /auth/signup; do
              verifier "$site$page" || echec=1
            done
          done
          exit $echec

      - name: Alerte si la prod ne répond pas
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.deployment.sha || github.sha }}
        run: |
          TITLE="Prod du site : pages publiques en erreur"
          BODY="Après la mise en production du commit ${SHA:0:8}, des pages publiques ne répondent pas : $RUN_URL

          Si la nouvelle version est en cause : Vercel → Deployments → « Instant Rollback » sur le déploiement précédent."
          NUMBER=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label bug --body "$BODY" \
              || gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
