name: CI — newbiv2

# Contrôles de chaque changement, une seule fois : sur sa PR (vers develop, ou
# vers main pour une release ou un hotfix). La PR de release est le premier
# passage sur l'ensemble des tickets fusionnés dans develop, d'où la CI aussi
# sur les PR vers main. Après fusion, les pushs sur develop et main relançaient
# les mêmes contrôles sur le même code (plus de la moitié des minutes de CI) :
# retirés, comme pour newbi-api (#733). Lancement manuel possible.
#
# Deux jobs en parallèle (résultat en ~3 min) :
#   - Contrôles : secrets, lint, types, audit, tests unitaires. Une seule
#     installation des dépendances au lieu d'une par contrôle, et chaque
#     contrôle tourne même si un autre échoue : un passage montre tout.
#   - Build : la compilation Next.
# Les tests de bout en bout (site + API sur base en mémoire) sont dans
# tests-e2e.yml : sur les PR vers main et depuis la page « Tests » de l'admin.

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks lit la liste des commits de la PR.
  pull-requests: read

env:
  NODE_VERSION: "22"

jobs:
  checks:
    name: Contrôles (secrets, lint, types, audit, tests unitaires)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks parcourt les commits de la PR.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Installer les dépendances
        id: installation
        run: npm ci

      - name: Recherche de secrets (gitleaks)
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Le résumé du job suffit ; l'artefact SARIF (un par lancement) ne sert à personne.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      - name: Lint (eslint)
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: npm run lint

      # Non bloquant pour l'instant : TypeScript reste minoritaire dans le code
      # (surtout du .js/.jsx). Retirer continue-on-error une fois à zéro erreur.
      - name: Typecheck (tsc), non bloquant
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        continue-on-error: true
        run: npm run typecheck

      # Les vulnérabilités hautes sont listées sans bloquer (Dependabot ouvre
      # les PR) ; seules les critiques des dépendances de production bloquent.
      - name: npm audit (critique bloquant)
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: |
          npm audit --audit-level=high --omit=dev || true
          if ! npm audit --audit-level=critical --omit=dev > /dev/null; then
            echo "::error::Vulnérabilités critiques dans les dépendances de production : voir la liste ci-dessus"
            exit 1
          fi

      - name: Tests unitaires (Vitest)
        id: tests
        if: ${{ !cancelled() && steps.installation.outcome == 'success' }}
        run: npm run test:run -- --coverage
        env:
          NODE_ENV: test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        with:
          name: frontend-coverage-report
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: Build (next)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      # Les routes API instancient leurs clients (Resend, Stripe…) au chargement
      # du module : les placeholders de .env.example suffisent pour le build
      - run: cp .env.example .env
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
